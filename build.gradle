plugins {
    id 'java'
    id 'application'
    id 'maven-publish'
}

application {
    mainClass = 'exercicio1.Main'
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'org.estg.test'
            artifactId = 'worldtime'
            version = '1.0'

            from components.java
        }
    }

    repositories {
        maven {
            url = layout.buildDirectory.dir("repo")
        }
    }
}

repositories {
    mavenCentral() //Remotamente
    flatDir {
        dir 'libs' //Localmente
    }
}

dependencies {
    implementation group: 'joda-time', name: 'joda-time', version: '2.14.4'
}

jar {
    manifest {
        attributes 'Specification-Title' : 'Exercício 1 - Eng.Software'
        attributes 'Specification-Version' : '1.0'
        attributes 'Specification-Vendor' : 'ESTG'
        attributes 'Implementation-Title' : 'exercicio1.Main'
        attributes 'Implementation-Version' : 'build01'
        attributes 'Implementation-Vendor' : 'ESTG'
        attributes 'Main-Class': 'exercicio1.Main'
    }
}

tasks.register('zipEntrega', Zip) {
    group = 'distribution'
    description = 'Gera um ZIP com o JAR e o javadoc do projeto.'

    archiveFileName = 'worldtime-1.0.zip'
    destinationDirectory = layout.buildDirectory.dir('entrega')

    from(tasks.jar)
    from(tasks.javadoc) {
        into 'javadoc'
    }
}

build.finalizedBy tasks.zipEntrega, tasks.publish